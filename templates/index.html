
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
        }

        button {
            padding: 8px 14px;
            margin: 5px;
            cursor: pointer;
        }

        input {
            padding: 8px;
        }

        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #cccccc;
        }
    </style>
</head>

<body>
    <h1>Student API Interface</h1>

    <!-- Student API -->
    <button onclick="loadStudent()">Load Student Information</button>
    <div id="result"></div>

    <hr>

    <!-- Greeting API -->
    <h2>Greeting API</h2>
    <input
        type="text"
        id="nameInput"
        placeholder="Enter your first name"
    >
    <button onclick="sayHello()">Say Hello</button>
    <p id="greeting"></p>

    <script>
        // Load Student Information
        function loadStudent() {
            fetch('/student')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('result').innerHTML =
                        '<p><b>Student ID:</b> ' + data.student_id + '</p>' +
                        '<p><b>Name:</b> ' + data.name + '</p>' +
                        '<p><b>Program:</b> ' + data.program + '</p>' +
                        '<p><b>Year:</b> ' + data.year + '</p>' +
                        '<p><b>Section:</b> ' + data.section + '</p>';
                })
                .catch(error => {
                    document.getElementById('result').innerHTML =
                        '<p>Unable to retrieve data.</p>';
                    console.error(error);
                });
        }

        // Greeting API
        function sayHello() {
            const name = document.getElementById('nameInput').value.trim();
            const greeting = document.getElementById('greeting');

            if (!name) {
                greeting.innerText = 'Please enter your first name.';
                return;
            }

            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => response.json())
                .then(data => {
                    greeting.innerText = data.message;
                })
                .catch(error => {
                    greeting.innerText = 'Unable to retrieve greeting.';
                    console.error(error);
                });
        }
    </script>
</body>
</html>
